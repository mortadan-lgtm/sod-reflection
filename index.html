<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflection: Lesson 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f3a5f; --teal:#1a8a8a; --teal-soft:#e3f3f3; --bg:#f4f7f9; --card:#ffffff;
  --ink:#1d2733; --muted:#5c6b7a; --line:#d5dee6;
  --ok:#2e7d4f; --ok-soft:#dff1e6; --bad:#a65252; --bad-soft:#f6e3e3; --amber:#b7791f; --amber-soft:#fdf3dc;
  --ray:#3d85c6; --normal:#6b7280; --green:#38761d; --orange:#e8871e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:19px;line-height:1.45}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
header.top h1{font-size:22px;margin:0;color:var(--navy)}
header.top .who{margin-left:auto;color:var(--muted);font-size:16px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.dot{flex:1 1 0;min-width:22px;height:10px;border-radius:6px;background:var(--line)}
.dot.done{background:var(--teal)} .dot.now{background:var(--navy)}
.card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 1px 3px rgba(20,40,60,.08);margin-bottom:16px}
.kicker{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--teal);margin:0 0 4px}
h2{margin:0 0 12px;font-size:26px;color:var(--navy)}
.prompt{font-size:21px;font-weight:700;margin:0 0 14px}
.sub{color:var(--muted);margin:-6px 0 14px;font-size:17px}
img.fig{display:block;max-width:100%;max-height:330px;margin:6px auto 14px;border-radius:10px}
.figrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.figrow img.fig{max-width:calc(50% - 6px);max-height:240px;margin:6px 0 12px}
@media (max-width:560px){.figrow img.fig{max-width:100%}}
.words{display:grid;gap:10px;margin:8px 0 6px}
.word{background:var(--teal-soft);border-radius:12px;padding:12px 14px}
.word b{color:var(--navy)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;min-height:56px;transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .let{flex:0 0 32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;color:var(--navy)}
.opt.sel{border-color:var(--navy);background:#eef3f9}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75;cursor:not-allowed}
.opt:disabled{cursor:default}
.mirror-word{display:inline-block;transform:scaleX(-1)}
.amb{font-weight:700;letter-spacing:.08em;font-size:24px;color:#c0392b}
.btnrow{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:13px 22px;font-weight:700;background:var(--navy);color:#fff;cursor:pointer;min-height:52px}
.btn.teal{background:var(--teal)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;display:none}
.fb.show{display:block}
.fb.good{background:var(--ok-soft);color:#1d5235}
.fb.hint{background:var(--amber-soft);color:#6b4a12}
.sim{background:#fbfcfd;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:14px}
.sim svg{display:block;width:100%;height:auto;touch-action:none}
.ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 6px 2px}
.ctrl label{font-weight:700;color:var(--navy)}
.ctrl input[type=range]{flex:1;min-width:180px;height:34px;accent-color:var(--teal)}
.readouts{display:flex;gap:8px;flex-wrap:wrap;padding:4px 6px}
.ro{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:17px}
.ro b{color:var(--navy)}
.toggle{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.toggle button{border:0;background:#fff;padding:9px 16px;cursor:pointer;font-weight:700;color:var(--muted)}
.toggle button.on{background:var(--teal);color:#fff}
/* place engine */
.tray{display:flex;flex-wrap:wrap;gap:10px;min-height:62px;padding:12px;border:2px dashed var(--line);border-radius:12px;background:#fbfcfd;margin-bottom:14px}
.tray:empty::after{content:"All placed. Press Check.";color:var(--muted);font-size:16px;align-self:center}
.chip{padding:10px 14px;border-radius:10px;background:#fff;border:2px solid var(--navy);color:var(--navy);font-weight:700;cursor:grab;user-select:none;touch-action:none;font-size:17px;line-height:1.3}
.chip.picked{background:var(--navy);color:#fff}
.chip.right{border-color:var(--ok);background:var(--ok-soft);color:#1d5235;cursor:default}
.chip.wrong{border-color:var(--bad);background:var(--bad-soft);color:#7a2e2e}
.ghost-chip{position:fixed;pointer-events:none;z-index:50;opacity:.9;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.zones{display:grid;gap:10px}
.zones.bins{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.zone{border:2px dashed var(--teal);border-radius:12px;padding:10px;min-height:58px;background:#fff;transition:background .1s}
.zone.over,.zone.target{background:var(--teal-soft)}
.zone .zlab{font-weight:700;color:var(--navy);font-size:17px;margin-bottom:6px}
.zone .zin{display:flex;flex-wrap:wrap;gap:8px;min-height:42px}
.slotrow{display:grid;grid-template-columns:var(--lw,240px) 1fr;gap:10px;align-items:center}
@media (max-width:560px){.slotrow{grid-template-columns:1fr;gap:4px}.slotrow.nums{grid-template-columns:48px 1fr}}
.slotrow .zone{min-height:54px;padding:6px}
.slotrow .zone .zin{min-height:38px}
.num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;margin-right:8px}
.rate{display:grid;gap:12px}
.rate .row{border:1px solid var(--line);border-radius:12px;padding:12px}
.rate .row p{margin:0 0 8px;font-weight:700}
.rate .pick{display:flex;gap:8px;flex-wrap:wrap}
.rate .pick button{flex:1;min-width:120px;padding:10px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.rate .pick button.on{border-color:var(--teal);background:var(--teal-soft)}
input.txt,select.txt{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;margin:4px 0 14px}
.status{font-size:15px;color:var(--muted);margin-top:8px}
.big{font-size:44px;font-weight:700;color:var(--teal);margin:6px 0}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.steps{margin:6px 0 10px;padding-left:0;list-style:none;counter-reset:st;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:10px 14px 10px 52px;background:#f3f6f9;border-radius:12px}
.steps li::before{content:counter(st);position:absolute;left:12px;top:9px;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;display:grid;place-items:center}
.tip{margin-top:10px;padding:12px 14px;border-left:5px solid var(--teal);background:var(--teal-soft);border-radius:8px}
a.relook{color:var(--teal);font-weight:700}
.itemcount{font-size:15px;color:var(--muted);margin-bottom:6px}
</style>
</head>

/* ===== Small helpers ===== */
const $ = (s, el=document) => el.querySelector(s);
const h = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const rad = d => d*Math.PI/180;
const NS = 'http://www.w3.org/2000/svg';
function arrowDefs(){ return `<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d85c6"/></marker>
  <marker id="ahg" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38761d"/></marker>
</defs>`; }
function hatchH(x1,x2,y,below=true){ let s=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#4a4f55" stroke-width="5"/>`;
  for(let x=x1+6;x<x2;x+=16) s+=`<line x1="${x}" y1="${y+3}" x2="${x+10}" y2="${y+(below?14:-14)}" stroke="#4a4f55" stroke-width="2"/>`; return s; }
function ray(x1,y1,x2,y2,col='#3d85c6',w=4){ const mx=(x1+x2)/2,my=(y1+y2)/2;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`+
         `<line x1="${x1}" y1="${y1}" x2="${mx}" y2="${my}" stroke="${col}" stroke-width="${w}" marker-end="url(#${col==='#38761d'?'ahg':'ah'})"/>`; }
function arc(cx,cy,r,a1,a2,col,w=3){ // screen angles in degrees, y down
  const p1=[cx+r*Math.cos(rad(a1)),cy+r*Math.sin(rad(a1))], p2=[cx+r*Math.cos(rad(a2)),cy+r*Math.sin(rad(a2))];
  const sweep = a2>a1?1:0, large = Math.abs(a2-a1)>180?1:0;
  return `<path d="M${p1[0].toFixed(1)},${p1[1].toFixed(1)} A${r},${r} 0 ${large} ${sweep} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w}"/>`; }

/* ===== Simulations ===== */
const SIMS = {
  /* Law of reflection: slider sets angle of incidence */
  law(el, opts={}){
    let i = opts.start ?? 30, showMirror = !!opts.mirrorAngle;
    const box = h('div',{class:'sim'});
    const svgWrap = h('div');
    const slider = h('input',{type:'range',min:'0',max:'80',step:'5',value:String(i),'aria-label':'Angle of incidence'});
    const ro = h('div',{class:'readouts'});
    box.append(svgWrap, h('div',{class:'ctrl'}, h('label',{},'Move the ray'), slider), ro);
    el.append(box);
    function draw(){
      const W=600,H=330,Px=300,Py=280,L=230;
      const sx=Px-L*Math.sin(rad(i)), sy=Py-L*Math.cos(rad(i));
      const ex=Px+L*Math.sin(rad(i)), ey=sy;
      let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="${NS}">${arrowDefs()}`;
      s+=hatchH(40,560,Py);
      s+=`<line x1="${Px}" y1="26" x2="${Px}" y2="${Py}" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8"/>`;
      s+=`<text x="${Px}" y="18" font-size="18" fill="#6b7280" text-anchor="middle">normal</text>`;
      s+=`<text x="520" y="${Py+40}" font-size="18" fill="#4a4f55">mirror</text>`;
      s+=ray(sx,sy,Px,Py)+ray(Px,Py,ex,ey);
      if(i>0){
        s+=arc(Px,Py,70,-90,-90-i,'#38761d')+arc(Px,Py,70,-90,-90+i,'#e8871e');
        let lx, ly;
        if(i<40){ lx=70*Math.sin(rad(i))+10; ly=Py-70*Math.cos(rad(i))+2; }        // just outside the ray, at the end of the arc
        else { lx=112*Math.sin(rad(i/2)); ly=Py-112*Math.cos(rad(i/2)); }           // along the middle of the arc
        s+=`<text x="${Px-lx}" y="${ly}" font-size="20" font-weight="700" fill="#38761d" text-anchor="end">${i}°</text>`;
        s+=`<text x="${Px+lx}" y="${ly}" font-size="20" font-weight="700" fill="#e8871e" text-anchor="start">${i}°</text>`;
      }
      if(showMirror){
        const m=90-i;
        if(m>0){ s+=arc(Px,Py,45,-180,-90-i,'#9aa3ad',3);
          if(m>=25){ const a=(-180+(-90-i))/2; s+=`<text x="${Px+62*Math.cos(rad(a))-6}" y="${Py+62*Math.sin(rad(a))+6}" font-size="17" fill="#6b7280" text-anchor="end">${m}° to mirror</text>`; }
        }
      }
      s+=`<text x="${Math.min(sx+30,Px-10)}" y="${sy-10}" font-size="17" fill="#3d85c6" text-anchor="end">incident ray</text>`;
      s+=`<text x="${Math.max(ex-30,Px+10)}" y="${ey-10}" font-size="17" fill="#3d85c6" text-anchor="start">reflected ray</text>`;
      s+='</svg>';
      svgWrap.innerHTML=s;
      ro.innerHTML = `<span class="ro" style="border-color:#38761d">Angle of incidence: <b>${i}°</b></span><span class="ro" style="border-color:#e8871e">Angle of reflection: <b>${i}°</b></span>` +
        (showMirror?`<span class="ro">Angle between ray and mirror: <b>${90-i}°</b></span>`:'');
    }
    slider.addEventListener('input',()=>{i=+slider.value;draw();});
    draw();
  },

  /* Smooth vs rough surface */
  surface(el){
    let rough=false;
    const box=h('div',{class:'sim'}), svgWrap=h('div');
    const tg=h('div',{class:'toggle'});
    const bS=h('button',{class:'on'},'Smooth'), bR=h('button',{},'Rough');
    tg.append(bS,bR);
    box.append(svgWrap,h('div',{class:'ctrl'},h('label',{},'Surface:'),tg));
    el.append(box);
    // rough profile: points every 40 px, gentle tilts (< 17°)
    const ys=[0,-8,4,-10,2,-12,0,-6,6,-6,4,-8,2,-4,0];
    const pts=ys.map((y,k)=>[40+k*40,240+y]);
    function yAt(x){ if(!rough) return [240,[0,-1]];
      for(let k=0;k<pts.length-1;k++){const [x1,y1]=pts[k],[x2,y2]=pts[k+1]; if(x>=x1&&x<=x2){const t=(x-x1)/(x2-x1),dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy); return [y1+t*(y2-y1),[dy/l,-dx/l]];}}
      return [240,[0,-1]]; }
    function draw(){
      const d=[Math.sin(rad(30)),Math.cos(rad(30))];
      let s=`<svg viewBox="0 0 600 320" xmlns="${NS}">${arrowDefs()}`;
      if(!rough) s+=`<rect x="40" y="240" width="520" height="40" fill="#e9dcc2"/><line x1="40" y1="240" x2="560" y2="240" stroke="#4a4f55" stroke-width="4"/>`;
      else { s+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')} 600,280 40,280" fill="#e9dcc2"/>`;
             s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#4a4f55" stroke-width="4"/>`; }
      [190,250,310,370,430].forEach(x=>{
        const [y,n]=yAt(x);
        const sx=x-200*d[0], sy=y-200*d[1];
        const dot=d[0]*n[0]+d[1]*n[1];
        const r=[d[0]-2*dot*n[0], d[1]-2*dot*n[1]];
        s+=`<line x1="${x}" y1="${y}" x2="${x+38*n[0]}" y2="${y+38*n[1]}" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>`;
        s+=ray(sx,sy,x,y,'#3d85c6',3)+ray(x,y,x+170*r[0],y+170*r[1],'#38761d',3);
      });
      s+=`<text x="40" y="306" font-size="17" fill="#4a4f55">${rough?'Rough: each normal points a different way, so the rays scatter.':'Smooth: every normal points the same way, so the rays stay parallel.'}</text>`;
      s+='</svg>'; svgWrap.innerHTML=s;
    }
    bS.onclick=()=>{rough=false;bS.className='on';bR.className='';draw();};
    bR.onclick=()=>{rough=true;bR.className='on';bS.className='';draw();};
    draw();
  },

  /* Plane mirror image */
  plane(el){
    let dq=3; const SQ=30, MX=300;
    const box=h('div',{class:'sim'}), svgWrap=h('div');
    const slider=h('input',{type:'range',min:'1',max:'8',step:'1',value:String(dq),'aria-label':'Object distance'});
    box.append(svgWrap,h('div',{class:'ctrl'},h('label',{},'Move the object'),slider));
    el.append(box);
    function draw(){
      const xo=MX-dq*SQ, xi=MX+dq*SQ, top=150, base=220, eye=[95,52];
      const t=(MX-xi)/(eye[0]-xi), py=top+t*(eye[1]-top);
      let s=`<svg viewBox="0 0 600 320" xmlns="${NS}">${arrowDefs()}`;
      // ruler squares
      for(let k=-8;k<8;k++){ s+=`<rect x="${MX+k*SQ}" y="258" width="${SQ}" height="22" fill="${k<0?'#eef6ea':'#f1f2f4'}" stroke="#c5ccd3"/>`; }
      s+=`<text x="${MX-120}" y="304" font-size="16" fill="#38761d" text-anchor="middle">in front of the mirror</text><text x="${MX+120}" y="304" font-size="16" fill="#6b7280" text-anchor="middle">behind the mirror</text>`;
      // mirror (vertical, silvered on left, hatching on the back)
      s+=`<line x1="${MX}" y1="30" x2="${MX}" y2="280" stroke="#4a4f55" stroke-width="5"/>`;
      for(let y=36;y<280;y+=16) s+=`<line x1="${MX+3}" y1="${y}" x2="${MX+14}" y2="${y+10}" stroke="#4a4f55" stroke-width="2"/>`;
      s+=`<text x="${MX+8}" y="24" font-size="17" fill="#4a4f55">mirror</text>`;
      // object arrow
      s+=`<line x1="${xo}" y1="${base}" x2="${xo}" y2="${top+8}" stroke="#38761d" stroke-width="6"/><path d="M${xo-11},${top+14} L${xo},${top-4} L${xo+11},${top+14} z" fill="#38761d"/>`;
      s+=`<text x="${xo}" y="${base+28}" font-size="16" fill="#38761d" text-anchor="middle">object</text>`;
      // image arrow (dashed outline)
      s+=`<line x1="${xi}" y1="${base}" x2="${xi}" y2="${top+8}" stroke="#9aa3ad" stroke-width="5" stroke-dasharray="7 5"/><path d="M${xi-11},${top+14} L${xi},${top-4} L${xi+11},${top+14} z" fill="none" stroke="#9aa3ad" stroke-width="2.5" stroke-dasharray="5 3"/>`;
      s+=`<text x="${xi}" y="${base+28}" font-size="16" fill="#6b7280" text-anchor="middle">image</text>`;
      // rays: object tip -> mirror -> eye; dashed back to image
      s+=ray(xo,top,MX,py)+ray(MX,py,eye[0],eye[1]);
      s+=`<line x1="${MX}" y1="${py}" x2="${xi}" y2="${top}" stroke="#9aa3ad" stroke-width="3" stroke-dasharray="8 6"/>`;
      // eye
      s+=`<path d="M${eye[0]-26},${eye[1]} Q${eye[0]},${eye[1]-18} ${eye[0]+26},${eye[1]} Q${eye[0]},${eye[1]+18} ${eye[0]-26},${eye[1]} z" fill="#fff" stroke="#1f3a5f" stroke-width="2.5"/><circle cx="${eye[0]+6}" cy="${eye[1]}" r="7" fill="#1f3a5f"/>`;
      s+=`<text x="${eye[0]}" y="${eye[1]-22}" font-size="16" fill="#1f3a5f" text-anchor="middle">your eye</text>`;
      s+='</svg>'; svgWrap.innerHTML=s;
    }
    slider.addEventListener('input',()=>{dq=+slider.value;draw();});
    draw();
  },

  /* Two hinged mirrors */
  hinge(el){
    const ANG=[180,120,90,72,60,45,40,36,30]; let k=0;
    const box=h('div',{class:'sim'}), svgWrap=h('div');
    const slider=h('input',{type:'range',min:'0',max:String(ANG.length-1),step:'1',value:'0','aria-label':'Angle between mirrors'});
    const ro=h('div',{class:'readouts'});
    box.append(svgWrap,h('div',{class:'ctrl'},h('label',{},'Close the hinge'),slider),ro);
    el.append(box);
    function draw(){
      const th=ANG[k], n=360/th-1, C=[300,190], R=95, M=150;
      let s=`<svg viewBox="0 0 600 370" xmlns="${NS}">`;
      // faint construction: where the mirror planes would repeat
      for(let j=0;j<360/th;j++){ const a=-90+th/2+j*th; s+=`<line x1="${C[0]}" y1="${C[1]}" x2="${C[0]+M*Math.cos(rad(a))}" y2="${C[1]+M*Math.sin(rad(a))}" stroke="#dfe4ea" stroke-width="2" stroke-dasharray="4 5"/>`; }
      // images
      for(let j=1;j<=n;j++){ const a=-90+j*th; s+=`<circle cx="${C[0]+R*Math.cos(rad(a))}" cy="${C[1]+R*Math.sin(rad(a))}" r="15" fill="#eef0f3" stroke="#9aa3ad" stroke-width="3" stroke-dasharray="5 3"/>`; }
      // mirrors
      [-90-th/2,-90+th/2].forEach((a,idx)=>{
        const x2=C[0]+M*Math.cos(rad(a)), y2=C[1]+M*Math.sin(rad(a));
        s+=`<line x1="${C[0]}" y1="${C[1]}" x2="${x2}" y2="${y2}" stroke="#4a4f55" stroke-width="6" stroke-linecap="round"/>`;
        // hatching on the back (outside the wedge)
        const out = idx===0 ? a-90 : a+90;
        for(let r=16;r<M;r+=16){ const bx=C[0]+r*Math.cos(rad(a)), by=C[1]+r*Math.sin(rad(a)); s+=`<line x1="${bx}" y1="${by}" x2="${bx+11*Math.cos(rad(out))}" y2="${by+11*Math.sin(rad(out))}" stroke="#4a4f55" stroke-width="2"/>`; }
      });
      if(th<180) s+=arc(C[0],C[1],40,-90-th/2,-90+th/2,'#e8871e',3);
      // object
      s+=`<circle cx="${C[0]}" cy="${C[1]-R}" r="15" fill="#38761d"/>`;
      s+=`<g font-size="16"><circle cx="40" cy="345" r="9" fill="#38761d"/><text x="56" y="351">object</text><circle cx="150" cy="345" r="9" fill="#eef0f3" stroke="#9aa3ad" stroke-width="2.5" stroke-dasharray="4 2"/><text x="166" y="351">image</text></g>`;
      s+='</svg>'; svgWrap.innerHTML=s;
      ro.innerHTML=`<span class="ro" style="border-color:#e8871e">Angle between the mirrors: <b>${th}°</b></span>`;
    }
    slider.addEventListener('input',()=>{k=+slider.value;draw();});
    draw();
  }
};

    s+=mk(1,200,222)+mk(2,400,222)+mk(3,326,70)+mk(4,272,218)+mk(5,328,218)+mk(6,500,282);

   {img:'mirror_photo', title:'The image in a plane mirror is…', steps:['the <b>same size</b> as the object','the <b>same way up</b>','<b>left and right swapped</b>','<b>virtual</b>: no light reaches it, so you cannot catch it on a screen']} ],
 [ {img:'hinge_photo', words:['Two mirrors joined at a <b>hinge</b>. You see the object <b>several times</b>.']},
   {img:'hinge_diag', words:['θ is the angle between the two mirrors.','Each mirror reflects the images in the <b>other</b> mirror.']},
   {sim:'hinge', text:['<b>Try it.</b> Close the hinge and watch the grey images.'], tip:'<b>Smaller angle → more images.</b>'} ],
 [ {title:'Mira\'s investigation', words:['Mira wants to <b>test the law of reflection</b>.','She has a ray box, a mirror, a protractor, paper and a pencil.']},
   {title:'Variables: an example', text:['Another student asks: does the <b>height of a ramp</b> change the <b>speed</b> of a toy car?'],
    steps:['<b>Independent variable</b> (I change it): the height of the ramp.','<b>Dependent variable</b> (I measure it): the speed of the car.','<b>Control variable</b> (I keep it the same): the same car.']},
   {title:'Question and prediction', steps:['A research question is a <b>question</b> with both variables: <i>How does the height of the ramp affect the speed of the car?</i>','A prediction uses <b>If … then …</b>: <i>If the ramp is higher, then the car goes faster.</i>']},
   {title:'A good method', steps:['Draw the <b>normal first</b>.','Measure every angle <b>from the normal</b>.','Test <b>5 angles</b>.','Repeat each one <b>3 times</b> and find the mean.']} ],
 [ {img:'lake', title:'Put it all together', steps:['A still lake acts like a <b>plane mirror</b>.','The image is the <b>same distance</b> behind the surface as the object is in front.','No light reaches the image: it is <b>virtual</b>.','The lake must be <b>smooth</b> so the reflection is <b>specular</b>.']} ]
];
STATIONS.forEach((st,k)=>st.lesson=LESSONS[k]);

/* ===== State ===== */
const KEY = 'sod-' + TASK.id;
let S = null;
function blank(){ return {id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), name:'', cls:'', st:0, it:-1, res:{}, ratings:[], done:false, lp:0}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
const allItems = () => STATIONS.flatMap((st,si)=>st.items.map((it,ii)=>({...it,key:si+'.'+ii})));
const scored = () => allItems().filter(i=>i.type!=='rate');

function record(key, label, answerText, ok){
  const r = S.res[key] || (S.res[key] = {label, first:answerText, ok1:ok, tries:0, done:false});
  r.tries++;
  if (ok) { r.done = true; r.final = answerText; }
  save();
}

/* ===== Sync to Google Sheet ===== */
let syncMsg = '';
function payload(status){
  const items = allItems();
  const labels = items.filter(i=>i.type!=='rate').map(i=>i.label);
  const cells = items.filter(i=>i.type!=='rate').map(i=>{
    const r=S.res[i.key]; if(!r) return {v:'',c:''};
    if(!r.done) return {v:'… '+r.first, c:'bad'};
    if(r.ok1) return {v:'✓ '+r.first, c:'ok'};
    return {v:'✗ '+r.first+'  →  ✓ '+r.final+' ('+r.tries+' tries)', c:'retry'};
  });
  const rate = STATIONS[STATIONS.length-1].items.find(i=>i.type==='rate');
  rate.rows.forEach((row,k)=>{ labels.push('SC'+(k+1)+' self-rating'); cells.push({v:S.ratings[k]||'',c:''}); });
  const sc = scored(), firstOk = sc.filter(i=>S.res[i.key]&&S.res[i.key].ok1).length;
  return {task:TASK.id, id:S.id, name:S.name, cls:S.cls, status, stations:(S.done?STATIONS.length:S.st)+'/'+STATIONS.length,
          score:firstOk, total:sc.length, labels, cells};
}
function sync(status){
  if(!SHEET_URL){ syncMsg='(Teacher sheet not connected yet)'; return Promise.resolve(false); }
  syncMsg='Sending…';
  return fetch(SHEET_URL,{method:'POST',body:JSON.stringify(payload(status)),keepalive:true})
    .then(r=>r.json()).then(j=>{ syncMsg = j.ok ? 'Saved to your teacher ✓' : 'Could not save. Ask your teacher.'; return !!j.ok; })
    .catch(()=>{ syncMsg='Could not reach your teacher\'s sheet. Your work is kept on this device.'; return false; })
    .finally(()=>{ const el=$('#syncline'); if(el) el.textContent=syncMsg; });
}

/* ===== Rendering ===== */
const app = $('#app');
function dots(){
  const d=$('#dots'); d.innerHTML='';
  STATIONS.forEach((st,k)=>d.append(h('div',{class:'dot'+(S&&(S.done||k<S.st)?' done':'')+(S&&!S.done&&k===S.st?' now':''),title:st.title})));
  $('#who').textContent = S&&S.name ? S.name+(S.cls?' · '+S.cls:'') : '';
}

function welcome(){
  dots(); app.innerHTML='';
  const prev = load();
  const c = h('div',{class:'card'});
  c.append(h('p',{class:'kicker'},'Year 11 · Unit 7: Waves'), h('h2',{},'Reflection'));
  if(prev && prev.name){
    c.append(h('p',{},`Welcome back, ${prev.name}!`));
    c.append(h('div',{class:'btnrow'},
      h('button',{class:'btn ghost',onclick:()=>{ try{localStorage.removeItem(KEY);}catch(e){} welcome(); }},'I am someone else'),
      h('button',{class:'btn teal',onclick:()=>{ S=prev; go(); }},'Continue')));
  } else {
    c.append(h('img',{class:'fig',src:IMG.lake,alt:'Mountains reflected in a still lake'}));
    c.append(h('p',{},'Work through 10 short stations. Each one starts with a short mini lesson, then a task. If you get something wrong, read the hint and try again.'));
    const nm=h('input',{class:'txt',placeholder:'First name and surname',autocomplete:'name'});
    const cl=h('select',{class:'txt'}, h('option',{value:''},'Choose your class'), h('option',{},'Y11 S5'), h('option',{},'Y11 S6'), h('option',{},'Other'));
    const go_=h('button',{class:'btn teal',disabled:'',onclick:()=>{ S=blank(); S.name=nm.value.trim(); S.cls=cl.value; save(); sync('started'); go(); }},'Start');
    const chk=()=>{ go_.disabled = !(nm.value.trim().length>=3 && cl.value); };
    nm.addEventListener('input',chk); cl.addEventListener('change',chk);
    c.append(h('label',{},'Your name'),nm,h('label',{},'Your class'),cl,h('div',{class:'btnrow'},go_));
  }
  app.append(c);
}

function go(){
  dots();
  if(S.done) return finish();
  if(S.it<0) return keycard();
  return item();
}

function keycard(){
  const st=STATIONS[S.st], pages=st.lesson, p=pages[S.lp||0], k=S.lp||0;
  app.innerHTML='';
  const c=h('div',{class:'card'});
  c.append(h('p',{class:'kicker'},`Station ${S.st+1} of ${STATIONS.length} · Mini lesson ${k+1} of ${pages.length}`), h('h2',{},p.title||st.title));
  if(p.sim){ const holder=h('div'); c.append(holder); SIMS[p.sim](holder,p.simOpts||{}); }
  if(p.img) c.append(h('img',{class:'fig',src:IMG[p.img],alt:''}));
  if(p.svg) c.append(h('div',{class:'sim',html:SVG[p.svg]()}));
  (p.text||[]).forEach(t=>c.append(h('p',{html:t})));
  if(p.words) c.append(h('div',{class:'words'},p.words.map(w=>h('div',{class:'word',html:w}))));
  if(p.steps) c.append(h('ol',{class:'steps'},p.steps.map(t=>h('li',{html:t}))));
  if(p.tip) c.append(h('div',{class:'tip',html:p.tip}));
  const last = k===pages.length-1;
  const row=h('div',{class:'btnrow'});
  if(k>0) row.append(h('button',{class:'btn ghost',onclick:()=>{S.lp=k-1;save();go();}},'←  Back'));
  row.append(h('button',{class:'btn teal',onclick:()=>{ if(last){S.it=(S.back!=null?S.back:0);S.back=null;S.lp=0;} else S.lp=k+1; save(); go(); }}, last?'Start the task  →':'Next  →'));
  c.append(row);
  app.append(c); window.scrollTo(0,0);
}

function peek(){ const it=S.it; S.it=-1; S.lp=0; S.back=it; save(); go(); }

function nextItem(){
  const st=STATIONS[S.st];
  if(S.it < st.items.length-1){ S.it++; save(); go(); return; }
  S.st++; S.it=-1; S.lp=0;
  if(S.st>=STATIONS.length){ S.done=true; save(); sync('finished'); finish(); return; }
  save(); sync('in progress'); go();
}

function item(){
  const st=STATIONS[S.st], it={...st.items[S.it], key:S.st+'.'+S.it};
  app.innerHTML='';
  const c=h('div',{class:'card'});
  c.append(h('p',{class:'kicker'},`Station ${S.st+1}: ${st.title}`), h('div',{class:'itemcount'},`Question ${S.it+1} of ${st.items.length}  ·  `, h('a',{href:'#',class:'relook',onclick:e=>{e.preventDefault();peek();}},'Look at the mini lesson again')));
  if(it.type==='sim'){ const holder=h('div'); c.append(holder); SIMS[it.sim](holder, it.simOpts||{}); }
  if(it.img) c.append(h('img',{class:'fig',src:IMG[it.img],alt:''}));
  if(it.svg) c.append(h('div',{class:'sim',html:SVG[it.svg]()}));
  c.append(h('p',{class:'prompt',html:it.prompt}));
  const fb=h('div',{class:'fb'});
  const next=h('button',{class:'btn teal',style:'display:none',onclick:nextItem},'Next  →');
  const done=(msg)=>{ fb.className='fb show good'; fb.innerHTML=msg||'Correct! Well done.'; next.style.display=''; };
  const hint=()=>{ fb.className='fb show hint'; fb.innerHTML='<b>Not quite.</b> '+it.hint+' Try again.'; c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); };
  const already = S.res[it.key] && S.res[it.key].done;

  if(it.type==='mcq'||it.type==='sim'){
    const order = shuffle(it.options.map((o,k)=>k));
    const box=h('div',{class:'opts'});
    order.forEach((k,pos)=>{
      const b=h('button',{class:'opt'}, h('span',{class:'let'},'ABCD'[pos]), h('span',{html:it.options[k]}));
      b.onclick=()=>{
        const txt = it.label.startsWith('7.4') ? (k===1?'mirrored word':'normal word') : it.options[k].replace(/<[^>]+>/g,'');
        if(k===it.answer){ record(it.key,it.label,txt,true); box.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add('right'); done(); }
        else { record(it.key,it.label,txt,false); b.classList.add('wrong'); b.disabled=true; hint(); }
      };
      box.append(b);
    });
    c.append(box);
  }
  else if(it.type==='multi'){
    const sel=new Set(), box=h('div',{class:'opts'}), btns=[];
    shuffle(it.options.map((o,k)=>k)).forEach((k,pos)=>{
      const b=h('button',{class:'opt'}, h('span',{class:'let'},'ABCDE'[pos]), h('span',{},it.options[k]));
      b.onclick=()=>{ sel.has(k)?sel.delete(k):sel.add(k); b.classList.toggle('sel'); };
      btns[k]=b; box.append(b);
    });
    const chk=h('button',{class:'btn',onclick:()=>{
      const pick=[...sel].sort(), ans=it.answer.slice().sort();
      const txt=pick.map(k=>it.options[k]).join('; ')||'(none)';
      const ok = pick.length===ans.length && pick.every((v,i)=>v===ans[i]);
      record(it.key,it.label,txt,ok);
      if(ok){ btns.forEach(b=>b&&(b.disabled=true)); it.answer.forEach(k=>btns[k].classList.add('right')); chk.style.display='none'; done(); }
      else { pick.filter(k=>!it.answer.includes(k)).forEach(k=>{btns[k].classList.remove('sel');btns[k].classList.add('wrong');btns[k].disabled=true;sel.delete(k);});
             const found=pick.filter(k=>it.answer.includes(k)).length;
             hint(); fb.innerHTML=`<b>Not quite.</b> You have ${found} of ${it.answer.length} right so far. ${it.hint} Try again.`; }
    }},'Check');
    c.append(box, h('div',{class:'btnrow'},chk));
  }
  else if(it.type==='place'){ placeEngine(c,it,fb,done,hint); }
  else if(it.type==='rate'){
    const opts=['Not yet','Getting there','Confident']; const ans=S.ratings.slice();
    const box=h('div',{class:'rate'});
    it.rows.forEach((r,k)=>{
      const pick=h('div',{class:'pick'});
      opts.forEach(o=>{ const b=h('button',{class:ans[k]===o?'on':''},o); b.onclick=()=>{ans[k]=o;pick.querySelectorAll('button').forEach(x=>x.className='');b.className='on';send.disabled=ans.filter(Boolean).length<it.rows.length;}; pick.append(b); });
      box.append(h('div',{class:'row'},h('p',{},r),pick));
    });
    const send=h('button',{class:'btn teal',onclick:()=>{S.ratings=ans;save();nextItem();}},'Finish and send  →');
    send.disabled = ans.filter(Boolean).length<it.rows.length;
    c.append(box,h('div',{class:'btnrow'},send)); app.append(c); window.scrollTo(0,0); return;
  }
  c.append(fb, h('div',{class:'btnrow'},next));
  if(already){ c.querySelectorAll('.opt').forEach(x=>x.disabled=true); c.querySelectorAll('.btnrow .btn:not(.teal)').forEach(x=>x.style.display='none'); done('You have already answered this one. Press Next.'); }
  app.append(c); window.scrollTo(0,0);
}

/* ===== Drag-and-drop / tap-to-place engine ===== */
function placeEngine(c,it,fb,done,hint){
  const tray=h('div',{class:'tray'});
  const zoneEls={};
  let picked=null;
  const chips = shuffle(it.chips.map((ch,k)=>({...ch,k})));
  const chipEl = {};
  chips.forEach(ch=>{ const e=h('div',{class:'chip',tabindex:'0'},ch.t); e.dataset.k=ch.k; chipEl[ch.k]=e; tray.append(e); });

  let zonesBox;
  if(it.mode==='bins'){
    zonesBox=h('div',{class:'zones bins'});
    it.zones.forEach(z=>{ const zin=h('div',{class:'zin'}); const ze=h('div',{class:'zone'},h('div',{class:'zlab',html:z.label}),zin); ze.dataset.z=z.id; zoneEls[z.id]={el:ze,inner:zin}; zonesBox.append(ze); });
  } else {
    zonesBox=h('div',{class:'zones'});
    const nums = it.zones.every(z=>/class="num"/.test(z.label));
    zonesBox.style.setProperty('--lw', nums ? '48px' : (it.zones.some(z=>z.label.length>8) ? '250px' : '90px'));
    it.zones.forEach(z=>{ const zin=h('div',{class:'zin'}); const ze=h('div',{class:'zone'},zin); ze.dataset.z=z.id; zoneEls[z.id]={el:ze,inner:zin};
      zonesBox.append(h('div',{class:'slotrow'+(nums?' nums':'')},h('div',{class:'zlab',html:z.label}),ze)); });
  }
  c.append(tray,zonesBox);

  const single = it.mode!=='bins';
  function placeIn(chip,zid){
    const Z=zoneEls[zid]; if(!Z) return;
    if(single && Z.inner.firstChild && Z.inner.firstChild.classList.contains('right')) return;
    if(single && Z.inner.firstChild && Z.inner.firstChild!==chip) tray.append(Z.inner.firstChild);
    Z.inner.append(chip); chip.classList.remove('picked','wrong'); picked=null; clearTargets(); updateCheck();
  }
  function clearTargets(){ Object.values(zoneEls).forEach(z=>z.el.classList.remove('target','over')); }
  function pick(chip){
    if(chip.parentElement!==tray && picked && picked!==chip){ placeIn(picked, chip.closest('.zone').dataset.z); return; }
    if(chip.classList.contains('right')) return;
    if(chip.parentElement!==tray){ tray.append(chip); chip.classList.remove('wrong'); updateCheck(); return; } // tap a placed chip to send it back
    if(picked===chip){ chip.classList.remove('picked'); picked=null; clearTargets(); return; }
    if(picked) picked.classList.remove('picked');
    picked=chip; chip.classList.add('picked'); Object.values(zoneEls).forEach(z=>z.el.classList.add('target'));
  }
  Object.entries(zoneEls).forEach(([zid,Z])=>Z.el.addEventListener('click',e=>{ if(picked && !e.target.closest('.chip')) placeIn(picked,zid); }));

  // pointer drag
  Object.values(chipEl).forEach(chip=>{
    let sx,sy,ghost=null,moved=false;
    chip.addEventListener('pointerdown',e=>{
      sx=e.clientX; sy=e.clientY; moved=false; chip.setPointerCapture(e.pointerId);
    });
    chip.addEventListener('pointermove',e=>{
      if(sx==null || chip.classList.contains('right')) return;
      if(!moved && Math.hypot(e.clientX-sx,e.clientY-sy)>8){ moved=true; ghost=chip.cloneNode(true); ghost.classList.add('ghost-chip'); ghost.style.width=chip.offsetWidth+'px'; document.body.append(ghost); chip.style.opacity='.35'; }
      if(moved){ ghost.style.left=(e.clientX-chip.offsetWidth/2)+'px'; ghost.style.top=(e.clientY-20)+'px';
        clearTargets(); const z=zoneAt(e.clientX,e.clientY); if(z) zoneEls[z].el.classList.add('over'); }
    });
    const end=e=>{
      if(sx==null) return; sx=null;
      if(moved){ const z=zoneAt(e.clientX,e.clientY); if(ghost) ghost.remove(); ghost=null; chip.style.opacity='';
        if(z) placeIn(chip,z); else if(chip.parentElement!==tray){ tray.append(chip); updateCheck(); } clearTargets(); }
      else pick(chip);
    };
    chip.addEventListener('pointerup',end);
    chip.addEventListener('pointercancel',()=>{ sx=null; if(ghost) ghost.remove(); ghost=null; chip.style.opacity=''; clearTargets(); });
    chip.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(chip);} });
  });
  function zoneAt(x,y){ for(const [zid,Z] of Object.entries(zoneEls)){ const r=Z.el.getBoundingClientRect(); if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) return zid; } return null; }

  const needed = it.chips.filter(ch=>ch.z!==null).length;
  const chk=h('button',{class:'btn',disabled:'',onclick:check},'Check');
  function placedCount(){ return Object.values(zoneEls).reduce((n,Z)=>n+Z.inner.children.length,0); }
  function updateCheck(){ chk.disabled = single ? Object.values(zoneEls).some(Z=>!Z.inner.firstChild) : placedCount()<needed; }
  function check(){
    let right=0, wrongs=[];
    Object.entries(zoneEls).forEach(([zid,Z])=>[...Z.inner.children].forEach(ch=>{
      const want=it.chips[+ch.dataset.k].z; if(String(want)===String(zid)){ right++; ch.classList.add('right'); } else wrongs.push(ch);
    }));
    const ok = wrongs.length===0 && right===needed;
    record(it.key,it.label,`${right}/${needed} placed right`,ok);
    if(ok){ chk.style.display='none'; tray.style.display='none'; done(); return; }
    wrongs.forEach(ch=>ch.classList.add('wrong'));
    hint(); fb.innerHTML=`<b>${right} of ${needed} right.</b> The red cards will go back. ${it.hint} Try again.`;
    setTimeout(()=>{ wrongs.forEach(ch=>{ ch.classList.remove('wrong'); tray.append(ch); }); updateCheck(); },1300);
  }
  c.append(h('div',{class:'btnrow'},chk));
}

function finish(){
  dots(); app.innerHTML='';
  const sc=scored(), first=sc.filter(i=>S.res[i.key]&&S.res[i.key].ok1).length;
  const c=h('div',{class:'card'});
  c.append(h('p',{class:'kicker'},'All 10 stations done'), h('h2',{},`Well done, ${S.name.split(' ')[0]}!`));
  c.append(h('p',{},'Right first time:'), h('div',{class:'big'},`${first} / ${sc.length}`));
  c.append(h('img',{class:'fig',src:IMG.lake,alt:''}));
  c.append(h('div',{class:'word',html:'The second mountain is <b>below</b> the water, as far below as the real one is above. <b>No light reaches it</b>: it is a <b>virtual image</b>. The lake must be <b>still</b> (smooth) so the reflection is <b>specular</b>.'}));
  c.append(h('p',{class:'status',id:'syncline'},syncMsg||''));
  c.append(h('div',{class:'btnrow'},h('button',{class:'btn ghost',onclick:()=>sync('finished')},'Send again')));
  app.append(c); window.scrollTo(0,0);
}

welcome();
</script>
